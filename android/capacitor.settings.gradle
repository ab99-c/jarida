// Dynamic resolution for Capacitor Android project dir across pnpm and standard setups
include ':capacitor-android'
def capDir = new File('../node_modules/@capacitor/android/capacitor')
if (!capDir.exists()) {
    def pnpmDirs = new File('../node_modules/.pnpm').listFiles()?.findAll { it.name.startsWith('@capacitor+android') }
    if (pnpmDirs && pnpmDirs.size() > 0) {
        capDir = new File(pnpmDirs[0], 'node_modules/@capacitor/android/capacitor')
    }
}
project(':capacitor-android').projectDir = capDir
