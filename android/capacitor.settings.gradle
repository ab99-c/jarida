// Dynamic resolution for Capacitor Android project dir across pnpm and standard setups
include ':capacitor-android'
def capDir = new File(settingsDir, '../node_modules/@capacitor/android/capacitor')
if (!capDir.exists()) {
    def pnpmDir = new File(settingsDir, '../node_modules/.pnpm')
    if (pnpmDir.exists()) {
        def found = pnpmDir.listFiles()?.find { it.name.startsWith('@capacitor+android') }
        if (found) {
            capDir = new File(found, 'node_modules/@capacitor/android/capacitor')
        }
    }
}
project(':capacitor-android').projectDir = capDir
