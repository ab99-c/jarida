name: Build Android APK (جريدة الأفق)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Jarida Live APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: pnpm build

      - name: Copy Assets & Ensure Capacitor Paths
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/public/* android/app/src/main/assets/public/
          mkdir -p android/capacitor-cordova-android-plugins
          node -e "
            const fs = require('fs');
            const cv = 'android/capacitor-cordova-android-plugins/cordova.variables.gradle';
            if (!fs.existsSync(cv)) {
              fs.writeFileSync(cv, 'ext {\\n  cdvMinSdkVersion = 24\\n  cdvPluginPostBuildExtras = []\\n  cordovaConfig = [:]\\n}\\n');
            }
            const p = 'android/capacitor.settings.gradle';
            const code = \"include ':capacitor-android'\\n\" +
              \"def capDir = new File(settingsDir, '../node_modules/@capacitor/android/capacitor')\\n\" +
              \"if (!capDir.exists()) {\\n\" +
              \"  def pnpmDir = new File(settingsDir, '../node_modules/.pnpm')\\n\" +
              \"  if (pnpmDir.exists()) {\\n\" +
              \"    def found = pnpmDir.listFiles()?.find { it.name.startsWith('@capacitor+android') }\\n\" +
              \"    if (found) {\\n\" +
              \"      capDir = new File(found, 'node_modules/@capacitor/android/capacitor')\\n\" +
              \"    }\\n\" +
              \"  }\\n\" +
              \"}\\n\" +
              \"project(':capacitor-android').projectDir = capDir\\n\";
            fs.writeFileSync(p, code);
          "

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Accept Android Licenses & SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" || true

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint > build.log 2>&1 || {
            echo "❌ Gradle assembleDebug failed. Showing last 150 lines of log:"
            tail -n 150 build.log
            echo "### ❌ Gradle Build Error Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload Build Log Artifact on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: android/build.log

      - name: Commit Failure Log to Repo for Inspection
        if: failure()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git pull origin main --rebase || true
          cp android/build.log ./BUILD_LOG.txt || true
          git add BUILD_LOG.txt
          git commit -m "debug: add gradle build log [skip ci]" || true
          git push origin main || true

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Jarida-Live.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarida-Live-Android-APK
          path: build-output/Jarida-Live.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0.0"
          name: "Jarida Live APK Release (تطبيق جريدة الأفق)"
          body: |
            ## تحميل تطبيق جريدة الأفق للأندرويد (Jarida Live APK) 📱
            - أحدث إصدار للأندرويد مع دعم الذكاء الاصطناعي والمساعد الصوتي ومناقشة المقالات صوتياً.
            - اضغط على **`Jarida-Live.apk`** أدناه لتحميله وتثبيته مباشرة على هاتفك.
          files: build-output/Jarida-Live.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
