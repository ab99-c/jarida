name: Build Android APK (جريدة الأفق)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Jarida Live APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: pnpm build

      - name: Copy Assets & Sync Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/public/* android/app/src/main/assets/public/
          pnpm exec cap sync android || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Jarida-Live.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarida-Live-Android-APK
          path: build-output/Jarida-Live.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0.0"
          name: "Jarida Live APK Release (تطبيق جريدة الأفق)"
          body: |
            ## تحميل تطبيق جريدة الأفق للأندرويد (Jarida Live APK) 📱
            - أحدث إصدار للأندرويد مع دعم الذكاء الاصطناعي والمساعد الصوتي ومناقشة المقالات صوتياً.
            - اضغط على **`Jarida-Live.apk`** أدناه لتحميله وتثبيته مباشرة على هاتفك.
          files: build-output/Jarida-Live.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
